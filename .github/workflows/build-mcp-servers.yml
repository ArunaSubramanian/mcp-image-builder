name: Build MCP Server Image

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Upstream repo (e.g., obot-platform/slack-mcp)"
        required: true
        type: string
      upstream_ref:
        description: "Git ref to build (tag, branch, or commit SHA)"
        required: true
        default: "main"
        type: string
      image_name:
        description: "Image name (e.g., slack-mcp)"
        required: true
        type: string
      dockerfile_path:
        description: "Path to Dockerfile in the upstream repo"
        required: false
        default: "Dockerfile"
        type: string

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      # Step 1: checkout YOUR repo (sets git context for upload-sarif)
      - name: Checkout own repo
        uses: actions/checkout@v6

      # Step 2: checkout THEIR repo into a subfolder
      - name: Checkout upstream repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.upstream_repo }}
          ref: ${{ inputs.upstream_ref }}
          path: upstream

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.lower.outputs.owner }}/mcp-servers/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.upstream_ref }}
            type=raw,value=latest

      # Step 3: build from the upstream/ subfolder
      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.lower.outputs.owner }}/mcp-servers/${{ inputs.image_name }}@${{ steps.build-and-push.outputs.digest }}
          format: "sarif"
          output: "trivy-results.sarif"

      # This now works because git context is YOUR repo's commit
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.lower.outputs.owner }}/mcp-servers/${{ inputs.image_name }}@${{ steps.build-and-push.outputs.digest }}
          format: "table"
          severity: "HIGH,CRITICAL"
          # exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes ghcr.io/${{ steps.lower.outputs.owner }}/mcp-servers/${{ inputs.image_name }}@${{ steps.build-and-push.outputs.digest }}
